<input id="name" placeholder="name" />
<input id="username" placeholder="username" />
<input id="password" type="password" placeholder="password" />
<button onclick="register()">Registrar</button>

<br /><br />

<input id="loginUser" placeholder="username" />
<input id="loginPass" type="password" placeholder="password" />
<button onclick="login()">Entrar</button>

<br /><br />

<button onclick="me()">Mostrar Informacion</button>

<br />

<div id="userInfo" style="display: none">
  <p><strong>Name:</strong> <span id="infoName"></span></p>
  <p><strong>Username:</strong> <span id="infoUsername"></span></p>
  <p id="passwordRow" style="display: none">
    <strong>Password:</strong> <span id="infoPassword2"></span>
  </p>
  <p><strong>Password (hashed):</strong> <span id="infoPassword"></span></p>
</div>

<script>
  let accessToken = null;

  async function register() {
    const res = await fetch("http://127.0.0.1:8000/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });

    const data = await res.json().catch(() => null);

    if (res.ok) {
      document.getElementById("name").value = "";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      alert("Usuario creado");
    } else {
      alert(data?.detail || "Error al crear usuario");
    }
  }

  async function login() {
    const form = new URLSearchParams();
    form.append("username", document.getElementById("loginUser").value);
    form.append("password", document.getElementById("loginPass").value);

    const res = await fetch("http://127.0.0.1:8000/login", {
      method: "POST",
      body: form,
      credentials: "include",
    });

    if (res.ok) {
      const data = await res.json();
      accessToken = data.access_token;
      alert("Usuario Autenticado\nToken: " + data.access_token);
    } else {
      alert("Fallo en la autenticacion");
    }
  }

  async function me() {
    const headers = {};

    if (accessToken) {
      headers["Authorization"] = "Bearer " + accessToken;
    }

    const res = await fetch("http://127.0.0.1:8000/users/me", {
      method: "GET",
      headers: headers,
      credentials: "include",
    });

    if (res.ok) {
      const data = await res.json();
      document.getElementById("infoName").textContent = data.name;
      document.getElementById("infoUsername").textContent = data.username;
      document.getElementById("infoPassword").textContent = data.password_hash;
      document.getElementById("userInfo").style.display = "block";

      const passwordRow = document.getElementById("passwordRow");
      if (data.password) {
        document.getElementById("infoPassword2").textContent = data.password;
        passwordRow.style.display = "block";
      } else {
        passwordRow.style.display = "none";
      }
    } else {
      alert("Error al obtener la informacion del usuario");
    }
  }
</script>
